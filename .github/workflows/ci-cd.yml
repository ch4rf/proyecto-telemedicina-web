name: CI/CD Pipeline - NovaSalud Telemedicina

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  # =========================================================================
  # JOB 1: Integración Continua de Base de Datos y Backend (Node.js + PostgreSQL)
  # =========================================================================
  ci-backend:
    name: "1. CI Backend & Esquema PostgreSQL"
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: admin_telemedicina
          POSTGRES_PASSWORD: password_seguro_123
          POSTGRES_DB: telemedicina_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del Backend
        working-directory: ./backend
        run: npm ci || npm install

      - name: Verificar sintaxis de capas (Controllers, Services, Repositories, Routes y Socket)
        working-directory: ./backend
        run: |
          node -c src/server.js
          for f in src/config/*.js src/controllers/*.js src/services/*.js src/repositories/*.js src/routes/*.js src/middlewares/*.js src/socket/*.js; do
            echo "Verificando $f..."
            node -c "$f"
          done

      - name: Validar scripts SQL (init.sql y rfid.sql) en PostgreSQL 15
        env:
          PGPASSWORD: password_seguro_123
        run: |
          psql -h localhost -U admin_telemedicina -d telemedicina_db -f database/init.sql
          psql -h localhost -U admin_telemedicina -d telemedicina_db -f database/rfid.sql

  # =========================================================================
  # JOB 2: Integración Continua de Frontend (React + Vite + Linter + Build)
  # =========================================================================
  ci-frontend:
    name: "2. CI Frontend React (Lint & Build)"
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Ejecutar análisis estático (Linter)
        working-directory: ./frontend
        run: npm run lint

      - name: Compilar versión de producción (Vite Build)
        working-directory: ./frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || '/api' }}
        run: npm run build

      - name: Publicar artefacto de producción del Frontend
        uses: actions/upload-artifact@v4
        with:
          name: novasalud-frontend-dist
          path: frontend/dist
          retention-days: 7

  # =========================================================================
  # JOB 3: Construcción y Verificación de Imágenes Docker (RNF-01 / RNF-02)
  # =========================================================================
  docker-build:
    name: "3. Build de Contenedores Docker (Backend & Frontend)"
    runs-on: ubuntu-latest
    needs: [ci-backend, ci-frontend]

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Construir imagen Docker del Backend
        run: docker build -t novasalud-backend:latest ./backend

      - name: Construir imagen Docker del Frontend
        run: docker build -t novasalud-frontend:latest ./frontend

  # =========================================================================
  # JOB 4: Despliegue Continuo en la Nube (CD - Azure)
  # =========================================================================
  cd-deploy:
    name: "4. CD Preparación y Despliegue Cloud"
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Descargar artefacto compilado del Frontend
        uses: actions/download-artifact@v4
        with:
          name: novasalud-frontend-dist
          path: ./dist_ready

      - name: Resumen de empaquetado listo para producción en la nube
        run: |
          echo "✅ Pipeline CI/CD completado exitosamente."
          echo "Archivos compilados de Frontend listos para distribución:"
          ls -la ./dist_ready
