version: '3.8'

services:
  # PostgreSQL
  postgres_db:
    image: postgres:15-alpine
    container_name: telemedicina_db
    restart: always
    environment:
      POSTGRES_USER: admin_telemedicina
      POSTGRES_PASSWORD: password_seguro_123
      POSTGRES_DB: telemedicina_db
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - telemedicina_network

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: telemedicina_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@telemedicina.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres_db
    networks:
      - telemedicina_network

volumes:
  pg_data:
    name: telemedicina_pg_data

networks:
  telemedicina_network:
    driver: bridge
