version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: nazareno_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: GestionNazareno
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./nazareno_backend/db_scripts:/docker-entrypoint-initdb.d

  app:
    build: .
    container_name: nazareno_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_USER=postgres
      - DB_PASSWORD=1234
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=GestionNazareno
    depends_on:
      - db

  pgadmin:
    image: dpage/pgadmin4
    container_name: nazareno_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@iglesia.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db

volumes:
  pgdata:
